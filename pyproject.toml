[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speclab"
version = "0.1.0"
description = "From-scratch autoregressive and speculative decoding experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SpecLab contributors"}]
dependencies = [
  "torch>=2.3",
  "transformers>=4.56,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[project.scripts]
speclab = "speclab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
